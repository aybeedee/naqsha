[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "naqsha"
version = "0.1.0"
description = "Data and modelling pipeline for a Lahore urban-flood planning tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
context = [
  "overturemaps==1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
